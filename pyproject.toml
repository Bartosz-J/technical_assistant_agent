[project]
name = "technical-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bartosz Jachnik", email = "bartekjachnik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mcp>=2.2.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
technical-assistant-agent = "technical_assistant_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
